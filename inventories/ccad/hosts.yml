---
all:
  children:
    # CEFET-MG's CCAD HPC cluster (https://www.ccad.cefetmg.br/guia/): SLURM + Singularity,
    # shared NFS $HOME, per-user conda envs (miniforge3). Reachable only over the CEFET VPN,
    # which drops idle connections, so nothing here may depend on a long-lived SSH session.
    runner:
      hosts:
        login.ccad.cefetmg.br:
          ansible_user: "{{ ccad_user | default('CHANGE_ME_set_CCAD_USERNAME', true) }}"
