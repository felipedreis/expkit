[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expkit"
dynamic = ["version"]
description = "Declarative, pre-registered experiments from hypothesis to report"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "ansible-core>=2.16,<2.18", "ansible-lint>=24"]

[project.scripts]
expkit = "expkit.cli:main"

[tool.hatch.version]
path = "src/expkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/expkit"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
